<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B332A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="박스출하">
<meta name="format-detection" content="telephone=no">
<title>박스출하 관리</title>
<style>
  :root{
    --paper:#F2F1EA;
    --paper-raised:#FBFAF6;
    --ink:#232620;
    --ink-soft:#6B6E64;
    --line:#DBD8CC;
    --forest:#2C4A3E;
    --forest-deep:#1B332A;
    --gold:#C69A3C;
    --gold-soft:#E9D9AE;
    --rust:#9C5B3C;
    --t1:#2C4A3E;
    --t2:#C69A3C;
    --t3:#9C5B3C;
    --t1-bg:#E4EBE6;
    --t2-bg:#F6EEDA;
    --t3-bg:#F1E3D9;
    --danger:#A33E33;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif;
    padding:28px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  header{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    padding-bottom:18px;
    margin-bottom:22px;
    border-bottom:2px solid var(--forest);
  }
  .title-block .eyebrow{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .title-block h1{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif;
    font-size:32px;
    margin:0;
    letter-spacing:-.01em;
    color:var(--forest-deep);
  }
  .totals{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .total-card{
    background:var(--forest);
    color:var(--paper-raised);
    border-radius:10px;
    padding:12px 20px;
    min-width:120px;
    text-align:right;
  }
  .total-card.alt{background:var(--forest-deep);}
  .total-card .label{
    font-size:11px;
    letter-spacing:.06em;
    opacity:.75;
    text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  }
  .total-card .value{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:26px;
    font-weight:700;
    line-height:1.3;
  }
  .total-card .value span{font-size:14px;font-weight:500;opacity:.7;margin-left:2px;}

  .action-row{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-bottom:6px;
  }

  .btn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    border-radius:8px;
    padding:9px 16px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--forest-deep);
  }
  .btn:hover{background:var(--gold-soft);border-color:var(--gold);}
  .btn.primary{
    background:var(--forest-deep);
    color:var(--paper-raised);
    border-color:var(--forest-deep);
  }
  .btn.primary:hover{background:var(--forest);}
  .btn.ghost-add{
    width:100%;
    margin-top:8px;
    border:1px dashed var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-size:12px;
    padding:8px;
  }
  .btn.ghost-add:hover{border-color:var(--gold);color:var(--forest-deep);background:var(--gold-soft);}

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
  }
  @media(max-width:820px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(27,51,42,0.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    background:var(--forest-deep);
    color:var(--paper-raised);
  }
  .cat-num{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif;
    font-weight:700;
    font-size:15px;
    width:30px;height:30px;
    border-radius:8px;
    background:var(--gold);
    color:var(--forest-deep);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .variety-select{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:var(--paper-raised);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif;
    font-weight:600;
    font-size:14px;
    padding:7px 10px;
    border-radius:8px;
    min-width:110px;
    flex:1;
  }
  .variety-select option{color:#111;}
  .variety-wrap{
    flex:1;
    display:flex;
    gap:8px;
    min-width:0;
  }
  .custom-variety-input{
    flex:1;
    min-width:0;
    min-height:44px;
    border:1px solid rgba(255,255,255,0.35);
    border-radius:8px;
    padding:7px 10px;
    background:#fff;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif;
    font-size:14px;
    outline:none;
  }
  .custom-variety-input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(198,154,60,.18);}

  .cat-del{
    flex:none;
    width:28px;height:28px;
    border-radius:7px;
    border:1px solid rgba(255,255,255,0.3);
    background:transparent;
    color:var(--paper-raised);
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  .cat-del:hover{background:var(--danger);border-color:var(--danger);}
  .cat-del:disabled{opacity:.3;cursor:not-allowed;}

  .grades{padding:12px 14px 8px;}
  .grade-block{
    border-left:4px solid var(--t1);
    background:var(--t1-bg);
    border-radius:8px;
    padding:10px 12px 10px;
    margin-bottom:10px;
  }
  .grade-block.t2{border-color:var(--t2);background:var(--t2-bg);}
  .grade-block.t3{border-color:var(--t3);background:var(--t3-bg);}

  .grade-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .grade-name{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif;
    font-weight:700;
    font-size:14px;
  }
  .grade-block.t1 .grade-name{color:var(--t1);}
  .grade-block.t2 .grade-name{color:var(--t2);}
  .grade-block.t3 .grade-name{color:var(--rust);}
  .grade-sub{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .grade-sub b{color:var(--ink);font-size:13px;}

  .row-line{
    display:grid;
    grid-template-columns:1fr 1fr 60px 24px;
    gap:6px;
    margin-bottom:5px;
    align-items:center;
  }
  .row-line:last-child{margin-bottom:0;}
  select.num{
    width:100%;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:13px;
    padding:6px 6px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .subtotal{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:13px;
    font-weight:700;
    text-align:right;
    color:var(--forest-deep);
    background:rgba(255,255,255,0.55);
    border-radius:6px;
    padding:6px 6px;
  }
  .row-del{
    width:22px;height:22px;
    border-radius:6px;
    border:1px solid rgba(0,0,0,0.12);
    background:rgba(255,255,255,0.6);
    color:var(--ink-soft);
    font-size:13px;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  .row-del:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
  .row-del:disabled{opacity:.25;cursor:not-allowed;}

  .col-caption{
    display:grid;
    grid-template-columns:1fr 1fr 60px 24px;
    gap:6px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .card-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px 16px;
    border-top:1px dashed var(--line);
    margin-top:2px;
  }
  .card-foot .sok{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .card-foot .sok b{
    font-size:20px;
    color:var(--forest-deep);
    margin-right:4px;
  }
  .card-foot .box-count{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
  }
  .card-foot .box-count b{
    font-size:20px;
    color:var(--gold);
    margin-left:4px;
  }

  .add-cat-wrap{
    margin-top:18px;
  }

  footer.reset-row{
    margin-top:10px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }


  /* 모바일/터치 최적화 */
  button, select, input { touch-action: manipulation; }
  button, select, input { -webkit-appearance:auto; appearance:auto; }
  input { -webkit-user-select:text; user-select:text; }
  select.num, .variety-select, .btn { min-height: 44px; }
  @media(max-width:600px){
    body{padding:max(16px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));}
    header{align-items:stretch;gap:12px;margin-bottom:14px;}
    .title-block h1{font-size:26px;}
    .totals{width:100%;}
    .total-card{flex:1;min-width:0;padding:10px 12px;}
    .total-card .value{font-size:22px;}
    .action-row{justify-content:stretch;}
    .action-row .btn{width:100%;}
    .card-head{padding:12px;}
    .grades{padding:10px;}
    .grade-block{padding:10px;}
    .row-line,.col-caption{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 58px 30px;gap:5px;}
    select.num{font-size:16px;padding:8px 4px;}
    .variety-wrap{flex-direction:column;gap:6px;}
    .variety-select,.custom-variety-input{font-size:16px;min-width:0;width:100%;}
    .subtotal{padding:9px 4px;}
    .row-del{width:30px;height:30px;}
    .btn.ghost-add{min-height:42px;}
  }

</style>
<link rel="manifest" href="./manifest.webmanifest">

<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <div class="eyebrow">code 1700-1373 · 박스출하 관리</div>
      <h1>박스출하 현황판</h1>
    </div>
    <div class="totals">
      <div class="total-card">
        <div class="label">총 박스</div>
        <div class="value" id="grandBox">0<span>개</span></div>
      </div>
      <div class="total-card alt">
        <div class="label">총 수량(속)</div>
        <div class="value" id="grandQty">0<span>속</span></div>
      </div>
    </div>
  </header>

  <div class="action-row">
    <button class="btn primary" id="exportBtn">엑셀로 내보내기</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="add-cat-wrap">
    <button class="btn ghost-add" id="addCatBtn" style="font-size:14px;padding:12px;">+ 카테고리 추가</button>
  </div>

  <footer class="reset-row">
    <button class="btn" id="resetBtn">전체 초기화</button>
  </footer>

</div>
<div id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1B332A;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999;max-width:88vw;text-align:center"></div>

<script>
const VARIETIES = ["쥬밀리아","클라란스","푸에고","만다라","헤라","하젤","빅토리아"];
const OTHER_VARIETY = "__OTHER__";
const GRADE_NAMES = ["특1","특2","특3"];
const BOX_MAX = 30;
const QTY_MAX = 50;

let catSeq = 0;
function newRow(){ return {box:0, qty:0}; }
function newGrade(name){ return {name, rows:[newRow()]}; }
function newCategory(){
  catSeq += 1;
  return {
    id: catSeq,
    variety: '',
    customVariety: '',
    grades: GRADE_NAMES.map(n => newGrade(n))
  };
}

let state = { categories: [ newCategory() ] };

const grid = document.getElementById('grid');

function makeOptions(max, unit, selected){
  let html = '';
  for(let i=0;i<=max;i++){
    html += `<option value="${i}" ${i===selected?'selected':''}>${i}${unit}</option>`;
  }
  return html;
}

function displayVariety(cat){
  return cat.variety === OTHER_VARIETY ? (cat.customVariety || '') : (cat.variety || '');
}

function saveState(){
  try{ localStorage.setItem('boxship_state_v2_default1', JSON.stringify({state,catSeq})); }catch(e){}
}

function render(){
  grid.innerHTML = '';
  state.categories.forEach((cat, ci) => {
    const card = document.createElement('div');
    card.className = 'card';

    let varietyOptions = `<option value="">품종 선택</option>` +
      VARIETIES.map(v => `<option value="${v}" ${cat.variety===v?'selected':''}>${v}</option>`).join('') +
      `<option value="${OTHER_VARIETY}" ${cat.variety===OTHER_VARIETY?'selected':''}>기타품종</option>`;

    const customVarietyHtml = cat.variety === OTHER_VARIETY
      ? `<input class="custom-variety-input" data-ci="${ci}" type="text" maxlength="30" placeholder="품종 이름 직접 입력" value="${String(cat.customVariety || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}">`
      : '';

    let gradesHtml = '';
    cat.grades.forEach((g, gi) => {
      let rows = '';
      g.rows.forEach((row, ri) => {
        rows += `
        <div class="row-line">
          <select class="num box-sel" data-ci="${ci}" data-gi="${gi}" data-ri="${ri}">${makeOptions(BOX_MAX,'개',row.box)}</select>
          <select class="num qty-sel" data-ci="${ci}" data-gi="${gi}" data-ri="${ri}">${makeOptions(QTY_MAX,'속',row.qty)}</select>
          <div class="subtotal">${row.box*row.qty}</div>
          <button class="row-del" data-ci="${ci}" data-gi="${gi}" data-ri="${ri}" ${g.rows.length<=1?'disabled':''} title="이 줄 삭제">×</button>
        </div>`;
      });
      const gradeQtyTotal = g.rows.reduce((s,r)=>s+r.box*r.qty,0);
      gradesHtml += `
      <div class="grade-block t${gi+1}">
        <div class="grade-head">
          <div class="grade-name">${g.name}</div>
          <div class="grade-sub">소계 <b>${gradeQtyTotal}</b> 속</div>
        </div>
        <div class="col-caption"><span>박스</span><span>수량</span><span style="text-align:right;">소계</span><span></span></div>
        ${rows}
        <button class="btn ghost-add add-row-btn" data-ci="${ci}" data-gi="${gi}">+ ${g.name} 줄 추가</button>
      </div>`;
    });

    const catBoxTotal = cat.grades.reduce((s,g)=>s+g.rows.reduce((a,r)=>a+r.box,0),0);
    const catQtyTotal = cat.grades.reduce((s,g)=>s+g.rows.reduce((a,r)=>a+r.box*r.qty,0),0);

    card.innerHTML = `
      <div class="card-head">
        <div class="cat-num">${ci+1}</div>
        <div class="variety-wrap">
          <select class="variety-select" data-ci="${ci}">${varietyOptions}</select>
          ${customVarietyHtml}
        </div>
        <button class="cat-del" data-ci="${ci}" ${state.categories.length<=1?'disabled':''} title="카테고리 삭제">×</button>
      </div>
      <div class="grades">
        ${gradesHtml}
      </div>
      <div class="card-foot">
        <div class="sok"><b>${catBoxTotal}</b>개 박스</div>
        <div class="box-count"><b>${catQtyTotal}</b>속 합계</div>
      </div>
    `;
    grid.appendChild(card);
  });

  const grandBox = state.categories.reduce((s,c)=>s+c.grades.reduce((a,g)=>a+g.rows.reduce((b,r)=>b+r.box,0),0),0);
  const grandQty = state.categories.reduce((s,c)=>s+c.grades.reduce((a,g)=>a+g.rows.reduce((b,r)=>b+r.box*r.qty,0),0),0);
  document.getElementById('grandBox').innerHTML = grandBox + '<span>개</span>';
  document.getElementById('grandQty').innerHTML = grandQty + '<span>속</span>';
  saveState();
}

grid.addEventListener('change', (e)=>{
  const t = e.target;
  const ci = t.dataset.ci, gi = t.dataset.gi, ri = t.dataset.ri;
  if(t.classList.contains('variety-select')){
    state.categories[ci].variety = t.value;
    if(t.value === OTHER_VARIETY && typeof state.categories[ci].customVariety !== 'string'){
      state.categories[ci].customVariety = '';
    }
  } else if(t.classList.contains('box-sel')){
    state.categories[ci].grades[gi].rows[ri].box = parseInt(t.value,10)||0;
  } else if(t.classList.contains('qty-sel')){
    state.categories[ci].grades[gi].rows[ri].qty = parseInt(t.value,10)||0;
  } else {
    return;
  }
  render();
});

grid.addEventListener('input', (e)=>{
  const t = e.target;
  if(!t.classList.contains('custom-variety-input')) return;
  const ci = t.dataset.ci;
  if(!state.categories[ci]) return;
  state.categories[ci].customVariety = t.value;
  saveState();
});

grid.addEventListener('click', (e)=>{
  const t = e.target;
  if(t.classList.contains('cat-del')){
    if(state.categories.length>1){
      state.categories.splice(t.dataset.ci,1);
      render();
    }
  } else if(t.classList.contains('row-del')){
    const grade = state.categories[t.dataset.ci].grades[t.dataset.gi];
    if(grade.rows.length>1){
      grade.rows.splice(t.dataset.ri,1);
      render();
    }
  } else if(t.classList.contains('add-row-btn')){
    state.categories[t.dataset.ci].grades[t.dataset.gi].rows.push(newRow());
    render();
  }
});

document.getElementById('addCatBtn').addEventListener('click', ()=>{
  state.categories.push(newCategory());
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  catSeq = 0;
  state = { categories: [ newCategory() ] };
  try{ localStorage.removeItem('boxship_state_v2_default1'); }catch(e){}
  render();
});

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ el.style.opacity='0'; }, 2200);
}

async function exportCsv(){
  const rows = [];
  rows.push(['박스출하 현황', '', '', '', '', '']);
  rows.push([]);
  rows.push(['카테고리', '품종', '등급', '박스', '수량', '소계']);

  let grandBox = 0, grandQty = 0;
  state.categories.forEach((cat, ci) => {
    let catBox = 0, catQty = 0;
    cat.grades.forEach(g => {
      g.rows.forEach(row => {
        const sub = row.box * row.qty;
        rows.push([ci+1, displayVariety(cat), g.name, row.box, row.qty, sub]);
        catBox += row.box;
        catQty += sub;
      });
    });
    rows.push(['', '', '카테고리 ' + (ci+1) + ' 소계', catBox, '', catQty]);
    rows.push([]);
    grandBox += catBox;
    grandQty += catQty;
  });
  rows.push(['', '', '총계', grandBox, '', grandQty]);

  const esc = v => {
    const s = String(v ?? '');
    return /[\",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const csv = '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n');
  const now = new Date();
  const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  const filename = `박스출하_${stamp}.csv`;

  try{
    const file = new File([csv], filename, {type:'text/csv;charset=utf-8'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'박스출하 내역'});
      showToast('파일 공유/저장을 열었어요');
      return;
    }
  }catch(err){
    if(err && err.name === 'AbortError') return;
  }

  try{
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    showToast('CSV 파일을 저장했어요');
  }catch(err){
    showToast('저장이 막혔어요. Safari/Chrome에서 다시 열어주세요.');
  }
}

document.getElementById('exportBtn').addEventListener('click', exportCsv);

try{
  const saved = JSON.parse(localStorage.getItem('boxship_state_v2_default1') || 'null');
  if(saved && saved.state && Array.isArray(saved.state.categories)){
    state=saved.state;
    state.categories.forEach(c => {
      if(typeof c.customVariety !== 'string') c.customVariety = '';
    });
    catSeq=saved.catSeq||saved.state.categories.length;
  }
}catch(e){}
render();

if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
